# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml
#
# Production compose with profile-based split for API/Worker droplets.
#
# All external services (DB, Redis, RabbitMQ, Qdrant) are cloud-hosted.
# This compose only runs: api, worker, beat, nginx, certbot.
#
# USAGE:
#   API droplet:    docker compose --profile api up -d
#   Worker droplet: docker compose --profile worker up -d
#   Local dev:      docker compose --profile all up -d  (+ override file)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Database migrations (run once before api starts) ──────────────────────
  migrations:
    build:
      context: .
      dockerfile: Dockerfile.worker   # Worker image has alembic + psycopg2
    env_file:
      - .env.production
    command: alembic upgrade heads
    restart: "no"
    profiles: ["api", "all"]

  # ── API (FastAPI / Uvicorn) ───────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env.production
    environment:
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
    ports:
      - "8000:8000"
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --workers ${UVICORN_WORKERS:-1}
      --proxy-headers
      --forwarded-allow-ips=*
    restart: always
    deploy:
      resources:
        limits:
          memory: 1500M    # Hard cap — API never loads ML models
          cpus: "0.9"      # 1-vCPU droplet: max is 1.0, leave 0.1 for nginx/OS
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    profiles: ["api", "all"]

  # ── Nginx (reverse proxy + SSL termination) ───────────────────────────────
  nginx:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot_challenge:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 64M
    profiles: ["api", "all"]

  # ── Certbot (SSL certificate renewal) ────────────────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - letsencrypt_certs:/etc/letsencrypt
      - ./certbot_challenge:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do certbot renew; sleep 12h & wait $${!}; done;'
    profiles: ["api", "all"]

  # ── Celery Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.production
    environment:
      - CELERY_HOT_START=${CELERY_HOT_START:-true}
      - CELERY_HOT_START_INCLUDE_GEMINI=${CELERY_HOT_START_INCLUDE_GEMINI:-false}
      - FASTEMBED_CACHE_DIR=/app/.fastembed_cache
    command: >
      celery -A app.worker worker
      -Q default,ocr,deadline
      -n worker@%h
      --concurrency ${CELERY_CONCURRENCY:-2}
      --pool=prefork
      --loglevel=info
    restart: always
    deploy:
      resources:
        limits:
          memory: 3500M   # 4GB droplet: 3.5GB limit, 500MB OS headroom
          cpus: "1.8"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pgrep -f 'celery.*worker' > /dev/null"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    profiles: ["worker", "all"]

  # ── Celery Beat (periodic tasks scheduler) ───────────────────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env.production
    environment:
      - FASTEMBED_CACHE_DIR=/app/.fastembed_cache
    command: >
      celery -A app.worker beat
      --scheduler celery.beat:PersistentScheduler
      --loglevel=info
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M    # Beat is lightweight — no ML models
          cpus: "0.25"
    depends_on:
      worker:
        condition: service_healthy
    profiles: ["worker", "all"]

volumes:
  letsencrypt_certs:
