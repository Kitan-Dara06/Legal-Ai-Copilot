services:
    db:
        image: postgres:15-alpine
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_DB: ${POSTGRES_DB:-legal_rag}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - internal
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        restart: always
        networks:
            - internal
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    migrations:
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - .env.production
        command: alembic upgrade head
        depends_on:
            db:
                condition: service_healthy
        networks:
            - internal

    api:
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost}
        env_file:
            - .env.production
        # API concurrency (HTTP). Background processing is still handled by Celery workers.
        # Override on the host: UVICORN_WORKERS=2 docker compose up -d --build api
        command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-4} --proxy-headers --forwarded-allow-ips=*
        restart: always
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/live"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 180s
        networks:
            - internal

    worker_pdf:
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - .env.production
        command: celery -A app.worker worker -Q default -n pdf_worker@%h -c 2
        restart: always
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            - internal

    worker_ocr:
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - .env.production
        command: celery -A app.worker worker -Q ocr -n ocr_worker@%h -c 1
        restart: always
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        networks:
            - internal

    rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
            RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
        restart: always
        networks:
            - internal
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    nginx:
        image: nginx:alpine
        volumes:
            - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
            - letsencrypt_certs:/etc/letsencrypt:ro
            - ./certbot_challenge:/var/www/certbot:ro
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            api:
                condition: service_healthy
        restart: always
        networks:
            - internal

    certbot:
        image: certbot/certbot
        volumes:
            - letsencrypt_certs:/etc/letsencrypt
            - ./certbot_challenge:/var/www/certbot
        entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
        networks:
            - internal

networks:
    internal:
        driver: bridge

volumes:
    rabbitmq_data:
    postgres_data:
    letsencrypt_certs:
